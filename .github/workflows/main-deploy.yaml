name: Deploy (main Branch)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Set up repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --group dev

      - name: 🧪 Run tests
        run: |
          uv run pytest tests/ -v
  
  version_bump:
    needs: unit_test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.psr.outputs.version }}
      tag: ${{ steps.psr.outputs.tag }}
      released: ${{ steps.psr.outputs.released }}
    permissions:
      contents: write
      packages: write
    steps:
      - name: ⚙️ Set up repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # important for tags

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Run Semantic Release
        id: psr
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show computed version/tag
        run: |
          echo "Version:   ${{ steps.psr.outputs.version }}"
          echo "Tag:       ${{ steps.psr.outputs.tag }}"
          echo "Released:  ${{ steps.psr.outputs.released }}"

  publish_pypi:
    needs: version_bump
    if: needs.version_bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⚙️ Set up repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version_bump.outputs.tag }}

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install uv
        run: python -m pip install uv

      - name: 📦 Build distributions
        run: uv build

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  update_homebrew:
    needs: [version_bump, publish_pypi]
    runs-on: ubuntu-latest
    steps:
      - name: ⏳ Wait for PyPI CDN propagation
        run: sleep 60

      - name: 🔍 Fetch SHA256 from PyPI
        id: pypi
        run: |
          VERSION="${{ needs.version_bump.outputs.version }}"
          JSON=$(curl -fsSL "https://pypi.org/pypi/lasagnastack/${VERSION}/json")
          SHA256=$(echo "$JSON" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          sdist = next(u for u in data['urls'] if u['packagetype'] == 'sdist')
          print(sdist['digests']['sha256'])
          ")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: ⚙️ Check out tap repo
        uses: actions/checkout@v4
        with:
          repository: jyjulianwong/homebrew-lasagnastack
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: ✏️ Update formula url and sha256
        run: |
          VERSION="${{ steps.pypi.outputs.version }}"
          SHA256="${{ steps.pypi.outputs.sha256 }}"
          sed -i "s|lasagnastack-.*\.tar\.gz\"|lasagnastack-${VERSION}.tar.gz\"|" tap/Formula/lasagnastack.rb
          sed -i 's|^  sha256 "[a-f0-9]*"|  sha256 "'"${SHA256}"'"|' tap/Formula/lasagnastack.rb

      - name: ♻️ Regenerate resource blocks
        run: |
          VERSION="${{ steps.pypi.outputs.version }}"
          python3 -m venv /tmp/poet-venv
          /tmp/poet-venv/bin/pip install --quiet "lasagnastack==${VERSION}" homebrew-pypi-poet
          /tmp/poet-venv/bin/poet --resources lasagnastack > /tmp/resources.txt
          python3 - << 'PYEOF'
          import json, re, pathlib, urllib.request

          # opencv-python-headless has no sdist; handled separately as arch-specific wheel resources
          EXCLUDE = {"opencv-python", "opencv-python-headless"}
          raw = pathlib.Path("/tmp/resources.txt").read_text()

          blocks = re.findall(r'  resource "[^"]+" do\n(?:.*\n)*?  end', raw)
          kept = "\n\n".join(b for b in blocks if not any(f'resource "{p}"' in b for p in EXCLUDE))

          # Fetch the latest opencv-python-headless cp312 wheels for both macOS architectures
          cv_json = json.loads(urllib.request.urlopen(
              "https://pypi.org/pypi/opencv-python-headless/json"
          ).read())
          wheels = {u["filename"]: u for u in cv_json["urls"] if "cp312" in u["filename"]}

          def find_wheel(tag: str):
              for fname, u in wheels.items():
                  if tag in fname:
                      return u["url"], u["digests"]["sha256"]
              raise RuntimeError(f"No cp312 wheel found for {tag!r}")

          arm_url, arm_sha = find_wheel("arm64")
          x86_url, x86_sha = find_wheel("x86_64")

          cv_blocks = (
              f'  on_arm do\n'
              f'    resource "opencv-python-headless" do\n'
              f'      url "{arm_url}"\n'
              f'      sha256 "{arm_sha}"\n'
              f'    end\n'
              f'  end\n\n'
              f'  on_intel do\n'
              f'    resource "opencv-python-headless" do\n'
              f'      url "{x86_url}"\n'
              f'      sha256 "{x86_sha}"\n'
              f'    end\n'
              f'  end'
          )

          all_resources = kept + "\n\n" + cv_blocks

          formula = pathlib.Path("tap/Formula/lasagnastack.rb")
          text = formula.read_text()

          # Replace the existing resource / on_arm / on_intel section, or insert before def install
          existing = re.search(
              r'\n(  (?:resource "[^"]+"|on_(?:arm|intel)) do\n(?:.*\n)*?  end\n?)+',
              text,
          )
          if existing:
              text = text[: existing.start()] + "\n\n" + all_resources + "\n\n" + text[existing.end():]
          else:
              text = text.replace("\n  def install", "\n\n" + all_resources + "\n\n  def install", 1)

          formula.write_text(text)
          PYEOF

      - name: 🚀 Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lasagnastack.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump lasagnastack to ${{ steps.pypi.outputs.version }}"
          git push
