name: Deploy (main Branch)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-vulnerabilities:
    name: Scan Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  unit_test:
    needs: scan-vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Set up repository
        uses: actions/checkout@v3

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv sync --group dev

      - name: 🧪 Run tests
        run: |
          uv run pytest tests/ -v
  
  version_bump:
    needs: unit_test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.psr.outputs.version }}
      tag: ${{ steps.psr.outputs.tag }}
      released: ${{ steps.psr.outputs.released }}
    permissions:
      contents: write
      packages: write
    steps:
      # token: the default GITHUB_TOKEN authenticates as github-actions[bot],
      # which never holds the Admin role branch_ruleset.tf (Infrastructure-GitHub)
      # exempts from its "no direct pushes to main" rule — semantic-release's
      # internal git push (which reuses the credential this checkout sets up)
      # needs an actual admin-role token to clear that rule, same as that
      # repo's own GH_ADMIN_TOKEN.
      - name: ⚙️ Set up repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # important for tags
          token: ${{ secrets.GH_ADMIN_TOKEN }}

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Run Semantic Release
        id: psr
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show computed version/tag
        run: |
          echo "Version:   ${{ steps.psr.outputs.version }}"
          echo "Tag:       ${{ steps.psr.outputs.tag }}"
          echo "Released:  ${{ steps.psr.outputs.released }}"

  publish_pypi:
    needs: version_bump
    if: needs.version_bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: ⚙️ Set up repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version_bump.outputs.tag }}

      - name: ⚙️ Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install uv
        run: python -m pip install uv

      - name: 📦 Build distributions
        run: uv build

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  build_binaries:
    needs: [version_bump, publish_pypi]
    if: needs.version_bump.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: ⚙️ Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version_bump.outputs.tag }}

      - name: ⚙️ Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 📦 Install PyInstaller and package
        run: |
          pip install pyinstaller
          pip install .

      - name: 🔨 Build single-file binary
        run: |
          pyinstaller --onefile --name lasagnastack \
            --collect-all lasagnastack \
            --collect-data mlflow \
            --collect-data pycapcut \
            src/lasagnastack/__main__.py

      - name: 📦 Package binary into tar.gz and compute sha256
        id: package
        run: |
          # Use "arm"/"intel" instead of "arm64"/"x86_64" to avoid Homebrew's
          # version parser treating digits in the arch label as a version number.
          ARCH_LABEL="${{ matrix.arch }}"
          if [ "$ARCH_LABEL" = "arm64" ]; then ARCH_LABEL="silicon"; fi
          if [ "$ARCH_LABEL" = "x86_64" ]; then ARCH_LABEL="intel"; fi
          TARBALL="lasagnastack-${{ needs.version_bump.outputs.version }}-macos-${ARCH_LABEL}.tar.gz"
          tar -czf "$TARBALL" -C dist lasagnastack
          SHA256=$(shasum -a 256 "$TARBALL" | awk '{print $1}')
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Upload tarball to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.version_bump.outputs.tag }}" \
            "${{ steps.package.outputs.tarball }}" \
            --clobber

      - name: 💾 Save sha256 as artifact
        run: echo "${{ steps.package.outputs.sha256 }}" > sha256-${{ matrix.arch }}.txt

      - name: ⬆️ Upload sha256 artifact
        uses: actions/upload-artifact@v4
        with:
          name: sha256-${{ matrix.arch }}
          path: sha256-${{ matrix.arch }}.txt

  update_homebrew:
    needs: [version_bump, build_binaries]
    if: needs.version_bump.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Download arm64 sha256
        uses: actions/download-artifact@v4
        with:
          name: sha256-arm64

      - name: ⬇️ Download x86_64 sha256
        uses: actions/download-artifact@v4
        with:
          name: sha256-x86_64

      - name: ⚙️ Check out tap repo
        uses: actions/checkout@v4
        with:
          repository: jyjulianwong/homebrew-lasagnastack
          token: ${{ secrets.GH_TAP_TOKEN }}
          path: tap

      - name: ✏️ Update formula for binary distribution
        env:
          VERSION: ${{ needs.version_bump.outputs.version }}
          TAG: ${{ needs.version_bump.outputs.tag }}
        run: |
          python3 - << 'PYEOF'
          import re, pathlib, os

          formula = pathlib.Path("tap/Formula/lasagnastack.rb")
          text = formula.read_text()

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          arm64_sha256 = pathlib.Path("sha256-arm64.txt").read_text().strip()
          x86_64_sha256 = pathlib.Path("sha256-x86_64.txt").read_text().strip()

          # Remove "include Language::Python::Virtualenv" line
          text = re.sub(r"  include Language::Python::Virtualenv\n+", "", text)

          # Remove any existing bottle / on_arm / on_intel blocks
          text = re.sub(r'\n  bottle do\n(?:.*\n)*?  end\n', '\n', text)
          text = re.sub(r'\n  on_arm do\n(?:.*\n)*?  end\n', '\n', text)
          text = re.sub(r'\n  on_intel do\n(?:.*\n)*?  end\n', '\n', text)

          # Remove top-level url and sha256 if present (replaced by on_arm/on_intel blocks)
          text = re.sub(r'  url "[^"]+"\n', '', text, count=1)
          text = re.sub(r'^  sha256 "[a-f0-9]+"\n', '', text, count=1, flags=re.MULTILINE)

          # Insert on_arm / on_intel blocks after the license line
          arch_blocks = (
              '\n  on_arm do\n'
              f'    url "https://github.com/jyjulianwong/LasagnaStack/releases/download/{tag}/lasagnastack-{version}-macos-silicon.tar.gz"\n'
              f'    sha256 "{arm64_sha256}"\n'
              '  end\n\n'
              '  on_intel do\n'
              f'    url "https://github.com/jyjulianwong/LasagnaStack/releases/download/{tag}/lasagnastack-{version}-macos-intel.tar.gz"\n'
              f'    sha256 "{x86_64_sha256}"\n'
              '  end\n'
          )
          text = re.sub(
              r'(  license "[^"]+"\n)',
              r'\1' + arch_blocks,
              text,
              count=1,
          )

          # Remove depends_on "python@3.12"
          text = re.sub(r'  depends_on "python@3\.12"\n', "", text)

          # Remove opencv comment lines that follow the depends_on block
          text = re.sub(r'  # opencv-python-headless[^\n]*\n(?:  #[^\n]*\n)*', "", text)

          # Remove all resource blocks
          text = re.sub(r'\n\n  resource "[^"]+" do\n(?:.*\n)*?  end', "", text)

          # Replace virtualenv_install_with_resources with binary install
          text = re.sub(
              r'    virtualenv_install_with_resources[^\n]*\n',
              '    bin.install "lasagnastack"\n',
              text,
          )

          # Normalize runs of 3+ blank lines down to 2
          text = re.sub(r'\n{3,}', '\n\n', text)

          formula.write_text(text)
          print("Formula updated successfully.")
          PYEOF

      - name: 🚀 Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/lasagnastack.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump lasagnastack to ${{ needs.version_bump.outputs.version }}"
          git push
